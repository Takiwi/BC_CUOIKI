services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ql_clb_mssql
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SqlAdmin@123456}
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    volumes:
      - ql_clb_mssql_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: ql_clb_cloudbeaver
    ports:
      - '8978:8978'
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - mssql
    restart: unless-stopped

volumes:
  ql_clb_mssql_data:
  cloudbeaver_data:
