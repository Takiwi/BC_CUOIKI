<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thiết lập sự kiện | Cổng quản lý CLB</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="container event-page py-4">
      <div class="mb-3">
        <a class="btn-ledger btn-ledger-secondary btn-sm" href="../list/index.html">
          <i class="bi bi-arrow-left me-1"></i>
          <span>Về danh sách sự kiện</span>
        </a>
      </div>

      <section class="ledger-card p-4 p-md-5">
        <header class="page-header border-bottom pb-3 mb-4">
          <span class="code-tag mb-1">QUẢN TRỊ HOẠT ĐỘNG</span>
          <h1 class="h3 fw-bold mb-1" id="form-title">Tạo sự kiện mới</h1>
          <p class="text-muted small mb-0">
            Chủ tịch và Ban chủ nhiệm thiết lập thông tin thời gian, địa điểm và giới hạn tham gia của hội viên.
          </p>
        </header>

        <div
          class="alert d-none mb-4"
          id="form-message"
          role="status"
          aria-live="polite"
        ></div>

        <form id="event-form" novalidate>
          <div class="mb-4">
            <label class="form-label fw-bold" for="name">
              Tên sự kiện <span class="text-danger">*</span>
            </label>
            <input
              class="form-control"
              id="name"
              name="name"
              placeholder="Ví dụ: Đại hội Thường niên Câu lạc bộ 2026"
              maxlength="200"
              required
            />
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold" for="startDate">
                <i class="bi bi-calendar-event me-1 text-muted"></i>Thời gian bắt đầu <span class="text-danger">*</span>
              </label>
              <input
                class="form-control font-monospace"
                id="startDate"
                name="startDate"
                type="datetime-local"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold" for="endDate">
                <i class="bi bi-calendar-check me-1 text-muted"></i>Thời gian kết thúc <span class="text-danger">*</span>
              </label>
              <input
                class="form-control font-monospace"
                id="endDate"
                name="endDate"
                type="datetime-local"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold" for="location">
              <i class="bi bi-geo-alt me-1 text-muted"></i>Địa điểm tổ chức <span class="text-danger">*</span>
            </label>
            <input
              class="form-control"
              id="location"
              name="location"
              placeholder="Ví dụ: Hội trường A, Tầng 3 Tòa nhà Trung tâm hoặc Link Zoom Online"
              maxlength="500"
              required
            />
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold" for="maxParticipants">
              <i class="bi bi-people me-1 text-muted"></i>Giới hạn số lượng thành viên tham gia
            </label>
            <input
              class="form-control font-monospace"
              id="maxParticipants"
              name="maxParticipants"
              type="number"
              min="1"
              step="1"
              placeholder="Để trống nếu không giới hạn"
              style="max-width: 300px;"
            />
            <div class="form-text small">Để trống nếu sự kiện mở tự do không giới hạn người tham dự.</div>
          </div>

          <div class="d-flex align-items-center gap-3 pt-3 border-top">
            <button class="btn-ledger btn-ledger-primary px-4 py-2" id="submit-button">
              <i class="bi bi-check2-circle me-1"></i>
              <span>Lưu sự kiện</span>
            </button>
            <a class="btn-ledger btn-ledger-secondary px-4 py-2" href="../list/index.html">
              Hủy bỏ
            </a>
          </div>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
