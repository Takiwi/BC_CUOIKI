<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sự kiện câu lạc bộ | Cổng quản lý CLB</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="container-fluid event-page py-4 px-lg-4">
      <header class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 page-header mb-4 pb-2 border-bottom">
        <div>
          <span class="code-tag mb-1">HOẠT ĐỘNG PHONG TRÀO</span>
          <h1 class="h3 fw-bold mb-1">Lịch trình & Hoạt động sự kiện</h1>
          <p class="text-muted small mb-0">Theo dõi lịch tổ chức, địa điểm và danh sách thành viên đăng ký tham gia</p>
        </div>
        <div>
          <a
            class="btn-ledger btn-ledger-primary d-none"
            id="create-event"
            href="../form/index.html"
          >
            <i class="bi bi-calendar-plus me-1"></i>
            <span>Tạo sự kiện mới</span>
          </a>
        </div>
      </header>

      <div
        class="alert d-none mb-4"
        id="page-message"
        role="status"
        aria-live="polite"
      ></div>

      <section class="ledger-sheet">
        <div class="ledger-header">
          <h2 class="ledger-title"><i class="bi bi-calendar3 me-2"></i>Sổ quản lý sự kiện</h2>
          <span class="code-tag">Cập nhật liên tục</span>
        </div>
        <div class="table-responsive">
          <table class="table-ledger">
            <thead>
              <tr>
                <th scope="col" style="width: 25%;">Tên sự kiện</th>
                <th scope="col" style="width: 25%;">Thời gian diễn ra</th>
                <th scope="col" style="width: 20%;">Địa điểm tổ chức</th>
                <th scope="col" class="text-center" style="width: 15%;">Số người tham gia</th>
                <th scope="col" style="width: 10%;">Trạng thái</th>
                <th scope="col" class="text-end" style="width: 5%;">Thao tác</th>
              </tr>
            </thead>
            <tbody id="events-list">
              <tr>
                <td colspan="6" class="p-5 text-center text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  <span>Đang tải danh sách sự kiện...</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
