<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chi tiết sự kiện | Cổng quản lý CLB</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="container event-page py-4">
      <div class="mb-3">
        <a class="btn-ledger btn-ledger-secondary btn-sm" href="../list/index.html">
          <i class="bi bi-arrow-left me-1"></i>
          <span>Về danh sách sự kiện</span>
        </a>
      </div>

      <div
        class="alert d-none mb-3"
        id="page-message"
        role="status"
        aria-live="polite"
      ></div>

      <section class="ledger-card" id="event-content" aria-live="polite">
        <div class="p-5 text-center text-muted">
          <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
          <span>Đang tải thông tin chi tiết sự kiện...</span>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
