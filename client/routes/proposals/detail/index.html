<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chi tiết đề xuất chi | Cổng quản lý CLB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="container-fluid proposal-detail-page py-4 px-lg-4">
      <div class="mb-3">
        <a class="btn-ledger btn-ledger-outline" href="../list/index.html">
          <i class="bi bi-arrow-left"></i>
          <span>Về Danh sách đề xuất</span>
        </a>
      </div>

      <header class="page-header mb-4 pb-2 border-bottom">
        <span class="code-tag mb-1">QUẢN TRỊ & BIỂU QUYẾT</span>
        <h1 class="h3 fw-bold mb-1">Hồ sơ chi tiết đề xuất chi tiêu</h1>
        <p class="text-muted small mb-0">
          Theo dõi tiến trình xét duyệt từ biểu quyết cử tri đến đối soát ngân quỹ trước phê duyệt <span class="text-nowrap">(Quy định BR-009 đến BR-012)</span>.
        </p>
      </header>

      <div id="page-message" class="alert d-none mb-3" role="status" aria-live="polite"></div>

      <!-- Root Container -->
      <section id="proposal-content" class="ledger-sheet">
        <div class="ledger-state-box">
          <div class="spinner-border text-primary ledger-state-icon" role="status"></div>
          <div class="ledger-state-title">Đang tải thông tin đề xuất chi...</div>
          <p class="ledger-state-desc">Đang đồng bộ dữ liệu dự toán và tiến độ biểu quyết.</p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
