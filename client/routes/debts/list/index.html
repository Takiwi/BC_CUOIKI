<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Khoản phải trả & Nợ | Cổng quản lý CLB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="container-fluid debt-page py-4 px-lg-4">
      <header class="page-header mb-4 pb-2 border-bottom">
        <span class="code-tag mb-1">TÀI CHÍNH & NGHĨA VỤ THANH TOÁN</span>
        <h1 class="h3 fw-bold mb-1">Khoản phải trả & Lịch sử giải ngân</h1>
        <p class="text-muted small mb-0">
          Quản lý các khoản chi phát sinh từ đề xuất; theo dõi công nợ và các đợt thanh toán hoàn tất <span class="text-nowrap">(Quy chế BR-010 / BR-014)</span>.
        </p>
      </header>

      <div id="page-message" class="alert d-none mb-4" role="status" aria-live="polite"></div>

      <!-- Debt List Container -->
      <section id="debt-list" class="vstack gap-3">
        <div class="ledger-state-box">
          <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
          <span>Đang tải danh sách khoản phải trả từ hệ thống...</span>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
