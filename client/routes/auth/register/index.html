<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Đăng ký thành viên | Cổng quản lý CLB</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="auth-shell">
      <section class="ledger-card auth-card p-4 p-sm-5">
        <div class="text-center mb-4">
          <span class="code-tag mb-2">THAM GIA CÂU LẠC BỘ</span>
          <h1 class="h3 fw-bold mb-1 text-ink">Đơn đăng ký gia nhập</h1>
          <p class="text-muted small mb-0">
            Đơn đăng ký sẽ được Ban chủ nhiệm xét duyệt trước khi kích hoạt
          </p>
        </div>
        
        <div
          class="alert d-none mb-3"
          id="form-message"
          role="status"
          aria-live="polite"
        ></div>
        
        <form id="register-form" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="fullName">
              <i class="bi bi-person me-1 text-muted"></i>Họ và tên <span class="text-danger">*</span>
            </label>
            <input
              class="form-control"
              id="fullName"
              name="fullName"
              placeholder="Nguyễn Văn A"
              autocomplete="name"
              maxlength="120"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">
              <i class="bi bi-envelope me-1 text-muted"></i>Địa chỉ Email <span class="text-danger">*</span>
            </label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              maxlength="254"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="password">
              <i class="bi bi-key me-1 text-muted"></i>Mật khẩu khởi tạo <span class="text-danger">*</span>
            </label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              placeholder="Tối thiểu 8 ký tự an toàn"
              autocomplete="new-password"
              minlength="8"
              maxlength="72"
              required
            />
            <div class="form-text small">Mật khẩu có độ dài tối thiểu 8 ký tự.</div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <label class="form-label fw-semibold" for="gender">
                <i class="bi bi-gender-ambiguous me-1 text-muted"></i>Giới tính
              </label>
              <select class="form-select" id="gender" name="gender">
                <option value="">Không cung cấp</option>
                <option value="MALE">Nam</option>
                <option value="FEMALE">Nữ</option>
                <option value="OTHER">Khác</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold" for="dateOfBirth">
                <i class="bi bi-calendar3 me-1 text-muted"></i>Ngày sinh
              </label>
              <input
                class="form-control font-monospace"
                id="dateOfBirth"
                name="dateOfBirth"
                type="date"
              />
            </div>
          </div>
          <button class="btn-ledger btn-ledger-primary w-100 py-2 justify-content-center" id="submit-button">
            <i class="bi bi-send me-1"></i>
            <span>Gửi đơn đăng ký</span>
          </button>
        </form>
        
        <div class="border-top mt-4 pt-3 text-center">
          <p class="text-muted small mb-0">
            Đã có tài khoản thành viên?
            <a class="fw-semibold text-decoration-none text-ink hover-underline" href="../login/index.html">Đăng nhập</a>
          </p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
