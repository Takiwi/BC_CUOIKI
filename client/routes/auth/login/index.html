<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Đăng nhập | Cổng quản lý CLB</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="../../../shared/app.css" rel="stylesheet" />
    <link href="route.css" rel="stylesheet" />
  </head>
  <body>
    <div data-auth-nav></div>
    <main class="auth-shell">
      <section class="ledger-card auth-card p-4 p-sm-5">
        <div class="text-center mb-4">
          <span class="code-tag mb-2">CỔNG THÀNH VIÊN</span>
          <h1 class="h3 fw-bold mb-1 text-ink">Đăng nhập tài khoản</h1>
          <p class="text-muted small mb-0">
            Truy cập hệ thống quản trị và thông tin hoạt động câu lạc bộ
          </p>
        </div>
        
        <div
          class="alert d-none mb-3"
          id="form-message"
          role="status"
          aria-live="polite"
        ></div>
        
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">
              <i class="bi bi-envelope me-1 text-muted"></i>Địa chỉ Email
            </label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              maxlength="254"
              required
            />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold" for="password">
              <i class="bi bi-key me-1 text-muted"></i>Mật khẩu
            </label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              placeholder="Nhập mật khẩu của bạn"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn-ledger btn-ledger-primary w-100 py-2 justify-content-center" id="submit-button">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            <span>Đăng nhập</span>
          </button>
        </form>
        
        <div class="border-top mt-4 pt-3 text-center">
          <p class="text-muted small mb-0">
            Chưa có tài khoản thành viên?
            <a class="fw-semibold text-decoration-none text-ink hover-underline" href="../register/index.html">Gửi đơn đăng ký</a>
          </p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../shared/api.js"></script>
    <script src="../../../shared/auth-nav.js"></script>
    <script src="route.js"></script>
  </body>
</html>
